[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wxbridge"
version = "0.1.0"
description = "Read-only, local-first Windows WeChat message CLI adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

[project.scripts]
wxbridge = "wxbridge.cli:main"

[project.optional-dependencies]
# Only needed when using an already-decrypted offline SQLite snapshot.
# The upstream checkout is intentionally separate, pinned and unbundled.
snapshot = ["cryptography>=41.0.0", "zstandard>=0.19.0"]

[tool.setuptools.packages.find]
where = ["src"]
